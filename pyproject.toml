[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-retroarch-sync"
version = "0.1.0"
description = "Sync battery saves, ROMs and cheats between Delta (iOS) and RetroArch (Windows)."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
delta-retroarch-sync = "delta_retroarch_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
