# Copy to config.toml and fill in only what automatic discovery gets wrong.
# config.toml is gitignored on purpose: it contains absolute paths specific to
# your machine, and this repository is public.

[paths]
# Delta's synced folder inside Dropbox. Normally found automatically by reading
# the Dropbox client's info.json; set this only if that fails.
# delta_folder = "C:/Users/you/Dropbox/Delta Emulator"

# Path to retroarch.cfg. Normally found automatically.
# retroarch_config = "C:/Users/you/AppData/Roaming/RetroArch/retroarch.cfg"

# RetroArch's save directory. Read from retroarch.cfg by default; override only
# if you keep saves somewhere the config does not describe.
# retroarch_save_dir = "C:/Users/you/AppData/Roaming/RetroArch/saves"

# Where ROMs pulled from Delta should be written for RetroArch to scan.
# retroarch_rom_dir = "C:/Users/you/Games/ROMs"

[options]
# push_enabled = false     # send desktop saves back to Delta
# sync_roms = true         # copy ROMs out of Delta
# sync_cheats = true       # export Delta's cheats as .cht files
# sync_on_open = true      # pull as soon as the launcher window opens

# Only needed to use your own Dropbox app registration instead of the bundled
# one. See docs/dropbox-app.md. The App *key*, never the App secret.
# dropbox_app_key = ""

# Standalone emulators, as a sync target alongside RetroArch.
#
# Every emulator below is *found* automatically and reported by the `emulators`
# command whether or not it is listed here. Listing it is what allows saves to
# be written into it: having mGBA installed is not a statement that these games
# should be synced into it.
#
# Each emulator keeps its own agreed state with Delta, so syncing the same game
# to RetroArch and to mGBA is two independent agreements rather than one.
#
# Known keys, and what each one runs:
#
#   mgba          Game Boy Advance, Game Boy / Color
#   vbam          Game Boy Advance, Game Boy / Color
#   snes9x        Super Nintendo
#   melonds       Nintendo DS
#   mupen64plus   Nintendo 64
#   sameboy       Game Boy / Color
#   bgb           Game Boy / Color
#
# Three more are recognised but refuse to be written to, because their save
# layout is known or suspected to differ from Delta's and no real file has been
# measured here to settle it. `emulators` prints the reason for each:
#
#   nestopia      NES -- may compress its save
#   desmume       DS  -- wants a footered .dsv; Delta's is raw
#   project64     N64 -- some versions byte-swap SRAM and FlashRAM
#
# [emulators]
# enabled = ["mgba", "mupen64plus"]

# Per emulator, both optional. `path` is only needed when the emulator cannot be
# found -- most ship as a zip rather than an installer, so they are only found
# once they have been run at least once. `save_dir` is only needed when the tool
# says it could not work out where the saves go.
#
# [emulators.mgba]
# path = "C:/Emulators/mGBA"
# save_dir = "D:/Saves/GBA"
